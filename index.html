 <div className="flex gap-2 w-full sm:w-auto"><label className="relative flex-1"><span className="sr-only">{t.search}</span><span className="absolute top-1/2 -translate-y-1/2 mut" style={{insetInlineStart:10}}><Ic n="search" s={15}/></span><input className="fld" style={{paddingInlineStart:32,padding:'.45rem .6rem .45rem 2rem'}} value={q} onChange={e=>setQ(e.target.value)} placeholder={t.search}/></label>
 <select className="fld" style={{width:'auto',padding:'.45rem .5rem'}} value={sort} onChange={e=>setSort(e.target.value)} aria-label="Sort">{['i','c','p'].map((v,i)=><option key={v} value={v}>{t.sorts[i]}</option>)}</select></div></div>
 <div className="overflow-x-auto"><table className="w-full text-sm" style={{minWidth:560}}><thead className="mut" style={{background:'rgba(0,0,0,.18)'}}><tr><th>#</th><th>{t.cur}</th><th className="hidden sm:table-cell">{lang==='fa'?'نماد':'Symbol'}</th><th>{t.buy}</th><th>{t.sell}</th><th>{t.chg}</th><th className="hidden md:table-cell">{t.chart}</th><th><span className="sr-only">Favorite</span></th></tr></thead>
 <tbody>{list.map(r=><tr key={r.code} className="cursor-pointer" onClick={()=>onPick(r.code)}><td>{fmt(r.i+1,lang)}</td><td><div className="flex items-center gap-2"><Flag c={r.code}/><div><div className="font-semibold">{lang==='fa'?r.fa:r.en}</div><div className="text-xs mut">{lang==='fa'?r.en:r.fa}</div></div></div></td><td className="hidden sm:table-cell mut">{r.code}</td><td>{fmt(r.buy,lang)}</td><td>{fmt(r.sell,lang)}</td><td className={r.chg>=0?'up':'dn'} dir="ltr" style={{textAlign:'start'}}>{pct(r.chg,lang)}</td><td className="hidden md:table-cell"><Spark seed={r.i+3} up={r.chg>=0}/></td>
 <td><button aria-pressed={favs.includes(r.code)} aria-label={'Favorite '+r.code} onClick={e=>{e.stopPropagation();toggle(r.code)}} style={{color:'var(--gold)'}}><svg width="20" height="20" viewBox="0 0 24 24" fill={favs.includes(r.code)?'currentColor':'none'} stroke="currentColor" strokeWidth="1.6"><path d={P.star}/></svg></button></td></tr>)}</tbody></table>
 {!list.length&&<p className="p-6 text-center mut">{t.empty}</p>}</div>
 <div className="p-3 flex justify-between text-xs mut"><span>{t.demo}</span><a href="#rates" className="gold">{t.all}</a></div></div>}

function Converter({rows,t,lang,from,setFrom,to,setTo,notify,ready}){const[mode,setMode]=useState('buy'),[amt,setAmt]=useState('1000');
 const k=mode==='buy'?'sell':'buy';const val=c=>c==='IRT'?1:rows.find(r=>r.code===c)[k];
 const opts=[{code:'IRT',en:t.toman,fa:t.toman},...CUR];const a=parseFloat(amt)||0;
 const rate=ready?val(from)/val(to):0,res=a*rate;
 const Sel=({v,set,lbl})=><div className="grid grid-cols-[1fr_1fr] gap-2"><label className="grid gap-1 text-sm mut">{lbl}<span className="relative block"><span className="absolute top-1/2 -translate-y-1/2" style={{insetInlineStart:8}}><Flag c={v} s={22}/></span><select className="fld" style={{paddingInlineStart:38}} value={v} onChange={e=>set(e.target.value)}>{opts.map(o=><option key={o.code} value={o.code}>{o.code} — {lang==='fa'?o.fa:o.en}</option>)}</select></span></label>
  {lbl===t.from?<label className="grid gap-1 text-sm mut">{t.amt}<input className="fld" inputMode="decimal" value={amt} onChange={e=>setAmt(e.target.value.replace(/[^0-9.]/g,''))}/></label>
  :<div className="grid gap-1 text-sm mut">{t.get}<output className="fld gold font-semibold" dir="ltr" style={{textAlign:'start'}}>{ready?fmt(res,'en',2):'—'}</output></div>}</div>;
 return <div className="card p-5 h-full"><h2 className="serif text-2xl font-semibold">{t.ex}</h2><p className="mut text-sm mb-4">{t.exs}</p>
 <div className="grid grid-cols-2 gap-2 mb-4" role="tablist">{['buy','sell'].map(m=><button key={m} role="tab" aria-selected={mode===m} className={mode===m?'gbtn':'obtn'} style={{justifyContent:'center'}} onClick={()=>setMode(m)}>{t[m]}</button>)}</div>
 <Sel v={from} set={setFrom} lbl={t.from}/><p className="text-xs mut text-end mt-1">{t.avail}</p>
 <div className="flex justify-center my-2"><button className="obtn" style={{padding:'.4rem'}} aria-label={t.swap} onClick={()=>{setFrom(to);setTo(from)}}><Ic n="swap" s={18}/></button></div>
 <Sel v={to} set={setTo} lbl={t.to}/><p className="text-xs mut text-end mt-1" dir="ltr">{t.rate}: 1 {from} = {ready?fmt(rate,'en',4):'—'} {to}</p>
 <button className="gbtn w-full mt-4 text-lg" disabled={!ready||!a||from===to} onClick={()=>notify(`${fmt(a,lang)} ${from} → ${fmt(res,lang,2)} ${to}. ${t.order}`)}>{t.c1}<Ic n="arrow" c="rtl:rotate-180"/></button>
 <p className="text-xs mut text-center mt-3">{t.demo}</p></div>}

function Social({k,url}){const L={telegram:'TG',x:'X',instagram:'IG',linkedin:'in',youtube:'YT'}[k];const st={width:34,height:34,border:'1px solid var(--line)',borderRadius:'50%',display:'grid',placeItems:'center',fontSize:12,color:'var(--gold)',opacity:url?1:.4};
 return url?<a href={url} target="_blank" rel="noopener noreferrer" style={st} aria-label={k}>{L}</a>:<span style={st} aria-label={k+' (not configured)'}>{L}</span>}

function App(){
 const[lang,setLang]=useState('en'),[theme,setTheme]=useState(()=>{try{return localStorage.getItem('homa-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch(e){return'dark'}});
 const[menu,setMenu]=useState(false),[modal,setModal]=useState(null),[toast,setToast]=useState(''),[favs,setFavs]=useState(['USD']),[from,setFrom]=useState('USD'),[to,setTo]=useState('EUR');
 const[rs,reload]=useRates();const t=T[lang];
 useEffect(()=>{const d=document.documentElement;d.lang=lang;d.dir=lang==='fa'?'rtl':'ltr';d.dataset.theme=theme;try{localStorage.setItem('homa-theme',theme)}catch(e){}},[lang,theme]);
 const notify=m=>{setToast(m);clearTimeout(window.__tt);window.__tt=setTimeout(()=>setToast(''),5000)};
 const rows=rs.st==='ok'?CUR.map(c=>({...c,buy:rs.rates[c.code][0],sell:rs.rates[c.code][1],chg:rs.rates[c.code][2]})):[];
 const toggle=c=>setFavs(f=>f.includes(c)?f.filter(x=>x!==c):[...f,c]);
 const pick=c=>{setFrom(c);document.getElementById('exchange').scrollIntoView({behavior:'smooth'})};
 const FEAT=['shield','chart','bolt','head'];
 return <>
 <svg width="0" height="0" style={{position:'absolute'}} aria-hidden="true"><defs><linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#f6dc98"/><stop offset="1" stopColor="#a8741f"/></linearGradient></defs></svg>
 <header className="hdr"><div className="max-w-[1280px] mx-auto px-4 h-[68px] flex items-center justify-between gap-3"><Logo s={44}/>
 <nav className="hidden xl:flex gap-5 text-sm" aria-label="Main">{t.nav.map((n,i)=><a key={i} href={NAVH[i]} className="py-1 hover:text-[var(--gold)]" style={{textDecoration:'none',color:'inherit'}}>{n}</a>)}</nav>
 <div className="flex items-center gap-2"><button className="obtn" style={{padding:'.4rem .6rem'}} onClick={()=>setLang(lang==='en'?'fa':'en')} aria-label="Language"><Ic n="globe" s={16}/>{lang==='en'?'EN':'فارسی'}</button>
 <button className="obtn" style={{padding:'.4rem'}} onClick={()=>setTheme(theme==='dark'?'light':'dark')} aria-label="Toggle theme"><Ic n={theme==='dark'?'moon':'sun'} s={18}/></button>
 <button className="obtn hidden sm:inline-flex" onClick={()=>setModal('login')}>{t.login}</button><button className="gbtn" style={{padding:'.45rem .9rem'}} onClick={()=>setModal('signup')}>{t.signup}</button>
 <button className="xl:hidden obtn" style={{padding:'.4rem'}} aria-expanded={menu} aria-label="Menu" onClick={()=>setMenu(!menu)}><Ic n={menu?'x':'menu'}/></button></div></div>
 {menu&&<nav className="xl:hidden px-4 pb-3 grid grid-cols-2 gap-2" style={{background:'var(--bg)'}}>{t.nav.map((n,i)=><a key={i} href={NAVH[i]} onClick={()=>setMenu(false)} className="card px-3 py-2 text-sm" style={{textDecoration:'none',color:'inherit'}}>{n}</a>)}<button className="obtn sm:hidden" onClick={()=>{setMenu(false);setModal('login')}}>{t.login}</button></nav>}</header>

 <main>
 <section id="home" className="relative overflow-hidden" style={{minHeight:480,color:'#f3ecd8'}}><Skyline/>
 <div className="absolute inset-0" style={{background:'linear-gradient(90deg,#05110e 0%,rgba(5,17,14,.72) 42%,rgba(5,17,14,.05) 80%)'}}/>
 <div className="orn absolute inset-y-0 start-0 w-20" style={{WebkitMaskImage:'linear-gradient(90deg,#000,transparent)',maskImage:'linear-gradient(90deg,#000,transparent)'}}/>
 <div className="hidden md:flex flex-col items-center absolute top-8 end-8 lg:end-16 text-center"><Bird s={96}/><div className="serif font-bold" style={{fontSize:44,color:'#ecd28f',textShadow:'0 2px 18px rgba(0,0,0,.6)'}}>صرافی هما</div><div className="gold" style={{letterSpacing:'.4em',color:'#e2c275'}}>HOMA EXCHANGE</div></div>
 <div className="relative max-w-[1280px] mx-auto px-4 pt-14 pb-32"><p className="mb-3" style={{color:'#e2c275'}}>{t.eye}</p>
 <h1 className="serif font-bold leading-[1.1]" style={{fontSize:'clamp(2.2rem,6vw,4rem)'}}>{t.h1}<br/><span style={{color:'#ecd28f'}}>{t.h2}</span></h1>
 <p className="mt-4 text-lg" style={{color:'#e2c275',letterSpacing:'.1em'}}>{t.tag}</p><p className="mt-3 max-w-md" style={{color:'#e9e2cf'}}>{t.desc}</p>
 <div className="mt-6 flex flex-wrap gap-3"><a href="#exchange" className="gbtn" style={{textDecoration:'none'}}>{t.c1}<Ic n="arrow" c="rtl:rotate-180"/></a><a href="#rates" className="obtn" style={{textDecoration:'none',color:'#f3ecd8',borderColor:'rgba(226,194,117,.7)'}}>{t.c2}</a></div></div></section>

 <section id="rates" className="max-w-[1280px] mx-auto px-4 -mt-20 relative z-10">
 <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">{rs.st==='loading'?[0,1,2,3].map(i=><Skel key={i}/>):rs.st==='err'?<div className="sm:col-span-2 lg:col-span-4"><Err t={t} retry={reload} msg={rs.msg}/></div>:rows.slice(0,4).map(r=>
 <button key={r.code} onClick={()=>pick(r.code)} className="card p-4 text-start"><div className="flex items-center gap-3"><Flag c={r.code} s={40}/><div><div className="font-semibold">{r.code}</div><div className="text-xs mut">{lang==='fa'?r.fa:r.en}</div></div></div>
 <div className="flex items-end justify-between mt-3"><div><div className="text-2xl font-semibold">{fmt(r.buy,lang)}</div><div className={'text-sm '+(r.chg>=0?'up':'dn')} dir="ltr">{r.chg>=0?'▲':'▼'} {pct(r.chg,lang)}</div></div><Spark seed={r.i+3} up={r.chg>=0}/></div></button>)}</div>
 {rs.st==='ok'&&<div className="flex flex-wrap items-center gap-3 mt-3 text-xs mut"><span className="gold">{rs.demo?t.demo:'Live'}</span><span>{t.upd}: {rs.at.toLocaleTimeString(lang==='fa'?'fa-IR':'en-US',{hour:'2-digit',minute:'2-digit'})}</span><button className="gold inline-flex items-center gap-1" onClick={reload}><Ic n="refresh" s={13}/>{t.retry}</button></div>}</section>

 <section className="max-w-[1280px] mx-auto px-4 mt-6 grid lg:grid-cols-[1.7fr_1fr] gap-5">
 <div id="markets">{rs.st==='loading'?<div className="grid gap-2" aria-live="polite" aria-label={t.load}>{[0,1,2,3,4].map(i=><Skel key={i} h={52}/>)}</div>:rs.st==='err'?<Err t={t} retry={reload} msg={rs.msg}/>:<Market rows={rows} t={t} lang={lang} favs={favs} toggle={toggle} onPick={pick}/>}</div>
 <div id="exchange"><Converter rows={rows} t={t} lang={lang} from={from} setFrom={setFrom} to={to} setTo={setTo} notify={notify} ready={rs.st==='ok'}/></div></section>

 <section id="fees" className="max-w-[1280px] mx-auto px-4 mt-6"><div className="card grid grid-cols-2 lg:grid-cols-4 gap-5 p-5">{t.f.map((f,i)=><div key={i} className="flex items-start gap-3"><span className="grid place-items-center shrink-0 rounded-full gold" style={{width:46,height:46,border:'1px solid var(--line)'}}><Ic n={FEAT[i]} s={22}/></span><div><h3 className="font-semibold">{f[0]}</h3><p className="text-sm mut">{f[1]}</p></div></div>)}</div></section>

 <section id="about" className="mt-6 relative overflow-hidden" style={{background:'linear-gradient(100deg,#0b2a21,#05110e 60%)',color:'#f3ecd8',borderBlock:'1px solid var(--line)'}}>
 <div className="orn absolute inset-0" style={{opacity:.12}}/>
 <div className="relative max-w-[1280px] mx-auto px-4 py-10 grid md:grid-cols-[1.2fr_1fr] lg:grid-cols-[1.1fr_1fr_.5fr] gap-6 items-center">
 <div><h2 className="serif text-3xl font-semibold">{t.ph}</h2><p className="mt-3 max-w-md" style={{color:'#d6d3c4'}}>{t.pp}</p><a href="#fees" className="obtn mt-5" style={{textDecoration:'none',color:'#f3ecd8',borderColor:'rgba(226,194,117,.7)'}}>{t.learn}<Ic n="arrow" c="rtl:rotate-180" s={16}/></a></div>
 <div id="contact" className="card p-5" style={{background:'rgba(5,17,14,.75)'}}><div className="flex items-center gap-3"><span className="grid place-items-center rounded-full" style={{width:44,height:44,background:'#2a9fd8'}}><Ic n="send" c="text-white"/></span><div><div className="font-semibold">{t.tg}</div><div className="text-sm" style={{color:'#b8c4bb'}}>{t.tgs}</div></div></div>
 <a href={CONFIG.TELEGRAM_URL} target="_blank" rel="noopener noreferrer" className="gbtn w-full mt-4" style={{textDecoration:'none'}}><Ic n="send" s={16}/>{t.tgb}</a><p className="text-center text-sm mt-2 gold" dir="ltr">{CONFIG.TELEGRAM_TEXT}</p></div>
 <div className="hidden lg:flex justify-center"><Bird s={170}/></div></div></section>
 </main>

 <footer style={{background:'#04100c',color:'#f3ecd8'}}><div className="max-w-[1280px] mx-auto px-4 py-10 grid sm:grid-cols-2 lg:grid-cols-[1.3fr_1fr_1fr_1fr_1.2fr] gap-8 text-sm">
 <div><Logo s={52}/><p className="mt-3" style={{color:'#b8c4bb'}}>{t.slogan}</p>{(CONFIG.BUSINESS.address||CONFIG.BUSINESS.phone||CONFIG.BUSINESS.license)&&<p className="mt-2 text-xs" style={{color:'#b8c4bb'}}>{CONFIG.BUSINESS.address} {CONFIG.BUSINESS.phone} {CONFIG.BUSINESS.license}</p>}</div>
 {[[t.q,t.nav.slice(0,5).map((n,i)=>[n,NAVH[i]])],[t.co,[5,6,7].map(i=>[t.nav[i],NAVH[i]])],[t.su,t.help.map(h=>[h,CONFIG.TELEGRAM_URL])]].map(([h,l])=><div key={h}><h3 className="gold font-semibold mb-2">{h}</h3><ul className="grid gap-1.5">{l.map(([n,u])=><li key={n}><a href={u} {...(u.startsWith('http')?{target:'_blank',rel:'noopener noreferrer'}:{})} style={{color:'#cfd6cc',textDecoration:'none'}}>{n}</a></li>)}</ul></div>)}

 <div className="max-w-[1280px] mx-auto px-4 pb-6 flex flex-wrap gap-4 justify-between items-center text-xs" style={{color:'#b8c4bb'}}><span>© {new Date().getFullYear()} HOMA EXCHANGE | صرافی هما. {t.rights}</span>
 <span className="flex gap-4"><button onClick={()=>setModal('priv')}>{t.priv}</button><button onClick={()=>setModal('terms')}>{t.terms}</button></span>

 {modal&&<Modal kind={modal} t={t} onClose={()=>setModal(null)} notify={notify}/>}
 {toast&&<div role="status" className="card fixed z-50 px-4 py-3 text-sm" style={{bottom:'calc(16px + env(safe-area-inset-bottom,0px))',insetInline:16,maxWidth:460,marginInline:'auto',background:'var(--bg2)'}}>{toast}</div>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
